<!doctype html>
<html lang="{{htmlLang}}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0f12" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonicalUrl}}">
  <link rel="alternate" hreflang="fi" href="{{hreflangFiUrl}}">
  <link rel="alternate" hreflang="en" href="{{hreflangEnUrl}}">
  <link rel="alternate" hreflang="x-default" href="{{hreflangFiUrl}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Raitsikat">
  <meta property="og:title" content="{{ogTitle}}">
  <meta property="og:description" content="{{ogDescription}}">
  <meta property="og:url" content="{{canonicalUrl}}">
  <meta property="og:image" content="{{assetOriginUrl}}/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ogImageAlt}}">
  <meta property="og:locale" content="{{ogLocale}}">
  <meta property="og:locale:alternate" content="{{ogLocaleAlternate}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{twitterTitle}}">
  <meta name="twitter:description" content="{{twitterDescription}}">
  <meta name="twitter:image" content="{{assetOriginUrl}}/icons/og-image.png">
  <meta name="twitter:image:alt" content="{{ogImageAlt}}">
  <script type="application/ld+json">{{jsonLd}}</script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="script" href="/vendor/leaflet/leaflet.js" />
  <link rel="modulepreload" href="/js/main.js" />
  <link rel="modulepreload" href="/js/map.js" />
  <link rel="modulepreload" href="/js/vehicles.js" />
  <link rel="modulepreload" href="/js/stops.js" />
  <link rel="modulepreload" href="/js/filter.js" />
  <link rel="modulepreload" href="/js/sse.js" />
  <link rel="modulepreload" href="/js/route-overlay.js" />
  <link rel="modulepreload" href="/js/animation.js" />
  <link rel="modulepreload" href="/js/connection.js" />
  <link rel="modulepreload" href="/js/mode.js" />
  <link rel="modulepreload" href="/js/location.js" />
  <link rel="modulepreload" href="/js/dom.js" />
  <link rel="modulepreload" href="/js/pure.js" />
  <link rel="modulepreload" href="/js/i18n.js" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="48x48" />
  <link rel="apple-touch-icon" href="/icons/icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Raitsikat" />

  <script>{{i18nScript}}</script>
  <script defer src="https://vahti.rigster.cv/script.js" data-website-id="2b352cb3-1936-4060-9fb3-6d18ee2aa4e0"></script>
</head>
<body>
  <noscript>
    <article class="seo-fallback">
      <h1>{{noscriptH1}}</h1>
      <p>{{noscriptP1}}</p>
      <p>{{noscriptP2}}</p>
    </article>
  </noscript>

  <div class="seo-hidden">
    <p lang="{{seoHiddenPrimaryLang}}">{{seoHiddenPrimaryText}}</p>
    <p lang="{{seoHiddenSecondaryLang}}">{{seoHiddenSecondaryText}}</p>
  </div>

  <div id="conn-toast" role="status" aria-live="polite" hidden>
    <span class="conn-toast__dot" aria-hidden="true"></span>
    <span class="conn-toast__label"></span>
  </div>
  <div id="map" aria-label="{{mapAria}}"></div>

  <header id="topbar">
    <div class="brand">
      <span class="brand__name">Raitsikat</span>
    </div>
    <nav id="mode-tabs" role="tablist" aria-label="{{vehicleModeAria}}">
      <button type="button" role="tab" data-mode="tram" aria-selected="true">{{tabTrams}}</button>
      <button type="button" role="tab" data-mode="bus" aria-selected="false">{{tabBuses}}</button>
    </nav>
    <span id="vehicle-count-top" class="topbar__count" data-vehicle-count>{{initialCount}}</span>
    <a id="lang-switch"
       href="{{langSwitchHref}}"
       hreflang="{{langSwitchTargetLocale}}"
       lang="{{langSwitchTargetLocale}}"
       aria-label="{{langSwitchAria}}">{{langSwitchText}}</a>
  </header>

  <section id="sheet" aria-label="{{sheetLines}}">
    <button id="sheet-toggle" aria-expanded="false" aria-controls="sheet-body">
      <span class="sheet__handle" aria-hidden="true"></span>
      <span class="sheet__title">{{sheetLines}}</span>
      <span class="sheet__count" id="vehicle-count" data-vehicle-count>{{initialCount}}</span>
    </button>
    <div id="sheet-body">
      <div id="line-filter" role="group" aria-label="{{lineFilterAria}}"></div>
    </div>
  </section>

  <script defer src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
