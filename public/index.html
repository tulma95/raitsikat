<body>
  <noscript>
    <article class="seo-fallback">
      <h1>Raitsikat — Helsingin ratikat ja bussit kartalla, reaaliajassa</h1>
      <p>Raitsikat näyttää HSL:n raitiovaunut ja bussit Helsingin kartalla
      reaaliajassa. Datalähteenä on HSL:n julkinen MQTT-syöte (High-Frequency
      Positioning). Voit suodattaa linjoittain ja klikata vaunua nähdäksesi
      sen reitin.</p>
      <p>Raitsikat shows Helsinki's HSL trams and buses on a live map,
      streamed from HSL's public MQTT feed. Filter by line, click a
      vehicle for its route.</p>
      <p>Sovellus toimii selaimessa eikä vaadi rekisteröitymistä.
      Asennettavissa myös PWA:na.</p>
    </article>
  </noscript>

  <div class="seo-hidden">
    <p>HSL:n raitiovaunut ja bussit live-kartalla Helsingissä.
    Helsinki trams and buses live map, HSL realtime data.</p>
  </div>

  <div id="conn-toast" role="status" aria-live="polite" hidden>
    <span class="conn-toast__dot" aria-hidden="true"></span>
    <span class="conn-toast__label"></span>
  </div>
  <div id="map" aria-label="Live map of Helsinki public transport"></div>

  <header id="topbar">
    <div class="brand">
      <span class="brand__name">Raitsikat</span>
    </div>
    <nav id="mode-tabs" role="tablist" aria-label="Vehicle mode">
      <button type="button" role="tab" data-mode="tram" aria-selected="true">Trams</button>
      <button type="button" role="tab" data-mode="bus" aria-selected="false">Buses</button>
    </nav>
    <span id="vehicle-count-top" class="topbar__count" data-vehicle-count>0 trams</span>
  </header>

  <section id="sheet" aria-label="Line filter">
    <button id="sheet-toggle" aria-expanded="false" aria-controls="sheet-body">
      <span class="sheet__handle" aria-hidden="true"></span>
      <span class="sheet__title">Lines</span>
      <span class="sheet__count" id="vehicle-count" data-vehicle-count>0 trams</span>
    </button>
    <div id="sheet-body">
      <div id="line-filter" role="group" aria-label="Show or hide lines"></div>
    </div>
  </section>
